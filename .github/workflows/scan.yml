name: Scan markets
on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:
concurrency:
  group: scan
  cancel-in-progress: false
permissions:
  contents: write
  actions: write
jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m unittest discover -s . -p "test_*.py"
      - name: Scan every 5 minutes
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          git config user.name scanner-bot
          git config user.email bot@users.noreply.github.com
          for i in 1 2 3 4 5; do
            start=$(date +%s)
            python scan.py || true
            git add data || true
            git diff --cached --quiet || (git commit -q -m "scan data" && git pull --rebase -q && git push -q) || true
            elapsed=$(( $(date +%s) - start ))
            if [ "$i" -lt 5 ] && [ "$elapsed" -lt 300 ]; then sleep $(( 300 - elapsed )); fi
          done
      - name: Start the next run
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run scan.yml
