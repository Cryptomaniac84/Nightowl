<!doctype html>
<html lang="en"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0A1020">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<title>NightOwl</title>
<style>
:root{--bg:#0A1020;--panel:#141B2D;--line:#243050;--text:#E6ECF8;--mute:#8A97B5;--blue:#3D8BFF;--green:#19D79A;--amber:#D9772B;--red:#E5484D}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-variant-numeric:tabular-nums}
body{padding:env(safe-area-inset-top) 0 calc(72px + env(safe-area-inset-bottom));max-width:720px;margin:0 auto}
header{padding:20px 16px 8px}
h1{margin:0;font-size:15px;font-weight:600;color:var(--mute);letter-spacing:.02em}
#verdict{font-size:26px;font-weight:700;line-height:1.2;margin:6px 0 4px}
#sub{color:var(--mute);font-size:14px}
#sub b{color:var(--text);font-weight:600}
.bar{height:3px;background:var(--line);margin:14px 16px 0;border-radius:2px;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--blue);transition:width 1s linear}
.warn{margin:12px 16px 0;padding:10px 12px;border:1px solid var(--amber);border-radius:8px;color:#F2B27A;font-size:14px}
main{padding:12px 16px}
.card{background:var(--panel);border-radius:12px;margin:0 0 12px;padding:14px 14px 14px 16px;border-left:4px solid var(--line)}
.card.confirmed{border-color:var(--green);box-shadow:0 0 24px -8px var(--green)}
.card.watch{border-color:var(--amber)}.card.blocked{border-color:var(--red)}
.row{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.pair{font-size:18px;font-weight:700}
.chip{font-size:13px;font-weight:600;padding:2px 9px;border-radius:99px;background:var(--line)}
.confirmed .chip{background:var(--green);color:#04251B}.watch .chip{background:var(--amber);color:#2A1500}.blocked .chip{background:var(--red);color:#fff}
.mute{color:var(--mute);font-size:14px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px 16px;margin:10px 0}
.grid span{display:block;color:var(--mute);font-size:13px}.grid b{font-size:16px}
.cond{list-style:none;padding:0;margin:8px 0;font-size:14px}.cond li{padding:1px 0}
.ok{color:var(--green)}.no{color:var(--mute)}
.reasons{margin:8px 0;padding:8px 10px;background:#2A1416;border-radius:8px;font-size:14px;color:#F3A5A8}
.btns{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
button,a.btn{font:inherit;font-size:14px;font-weight:600;color:var(--text);background:var(--line);border:0;border-radius:8px;padding:9px 12px;text-decoration:none;min-height:40px}
a.btn.go{background:var(--blue)}
.empty{padding:28px 8px;text-align:center;color:var(--mute)}
.coin{display:flex;justify-content:space-between;padding:12px 0;border-bottom:1px solid var(--line)}
.coin .dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:8px;background:var(--line)}
.dot.green{background:var(--green)}.dot.amber{background:var(--amber)}.dot.red{background:var(--red)}
nav{position:fixed;left:0;right:0;bottom:0;display:flex;background:#0D1428;border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
nav button{flex:1;font-size:13px;padding-left:2px;padding-right:2px;background:none;border-radius:0;color:var(--mute);padding:14px 0;min-height:56px}
nav button.on{color:var(--text);box-shadow:inset 0 3px 0 var(--blue)}
.plain{margin:10px 0;padding:9px 11px;background:#0F2240;border-radius:8px;font-size:14px;line-height:1.5}
.learn h3{margin:14px 0 6px;font-size:16px}.learn p,.learn li{font-size:14px;color:var(--mute);margin:4px 0}.learn li b{color:var(--text)}
.fld{display:block;margin:8px 0}.fld span{display:block;color:var(--mute);font-size:13px;margin-bottom:3px}.fld input,.fld select{width:100%;font:inherit;color:var(--text);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:10px;min-height:44px}
.trade{padding:12px 0;border-top:1px solid var(--line)}
.foot{color:var(--mute);font-size:13px;padding:8px 0 0}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style></head><body>
<header><h1>NightOwl</h1><div id="verdict">Loading…</div><div id="sub"></div></header>
<div class="bar"><i id="prog"></i></div>
<div id="warn"></div>
<main id="view"></main>
<nav><button data-t="opp" class="on">Now</button><button data-t="watch">Watchlist</button><button data-t="hist">Alerts</button><button data-t="res">Track</button><button data-t="more">More</button></nav>
<script>
const TZ="Australia/Sydney",$=s=>document.querySelector(s);
const fmtT=t=>new Date(t*1000).toLocaleString("en-AU",{timeZone:TZ,weekday:"short",day:"numeric",month:"short",hour:"2-digit",minute:"2-digit",hour12:false,timeZoneName:"short"});
const num=v=>v==null?"–":(v>=100?v.toFixed(2):v>=1?v.toFixed(4):v.toFixed(Math.max(4,3-Math.floor(Math.log10(v)))));
const mins=t=>Math.max(0,Math.round((Date.now()/1000-t)/60));
function h(tag,cls,text){const e=document.createElement(tag);if(cls)e.className=cls;if(text!=null)e.textContent=text;return e}
let D={},tab="opp",lastLoad=0;
async function j(f){try{const r=await fetch(f+"?t="+Date.now(),{cache:"no-store"});if(!r.ok)throw 0;return await r.json()}catch(e){return null}}
async function load(){
  const [l,hi,he,pa]=await Promise.all([j("data/latest.json"),j("data/history.json"),j("data/health.json"),j("data/paper.json")]);
  D={l,hi:hi||[],he,pa:pa||[]};lastLoad=Date.now();render();
}
function setups(){
  const out=[];(D.l?.coins||[]).forEach(c=>(c.setups||[]).forEach(s=>out.push({c,s,st:s.plan?.status})));return out}
function rank(x){return {CONFIRMED:0,BLOCKED:1,WATCH:2}[x.st]??9}
function render(){
  const age=D.l?mins(D.l.time):null,stale=age==null||age>20;
  const all=setups(),conf=all.filter(x=>x.st==="CONFIRMED").length,blk=all.filter(x=>x.st==="BLOCKED").length;
  $("#verdict").textContent=!D.l?"No scan data yet":stale?"Data is out of date":conf?conf+" confirmed trade"+(conf>1?"s":""):"Nothing to trade right now";
  $("#verdict").style.color=conf&&!stale?"var(--green)":stale?"var(--amber)":"var(--text)";
  $("#sub").replaceChildren();
  if(D.l){const s=$("#sub");s.append("Last scan ",h("b",0,fmtT(D.l.time))," (",h("b",0,age+" min ago"),"), "+(D.l.coins||[]).length+" coins checked")}
  const w=$("#warn");w.replaceChildren();
  if(D.he&&D.he.errors&&D.he.errors.length)w.append(h("div","warn","Scanner problem: "+D.he.errors[0]));
  if(stale&&D.l){w.append(h("div","warn","The last scan was "+age+" minutes ago. Do not act on anything below until a fresh scan runs. Check the Health tab."))}
  document.querySelectorAll("nav button").forEach(b=>b.classList.toggle("on",b.dataset.t===tab));
  const v=$("#view");v.replaceChildren();({opp:vOpp,watch:vWatch,hist:vHist,res:vTrack,more:vMore})[tab](v,stale);
}
function copyBtn(label,val){const b=h("button",0,"Copy "+label);b.onclick=async()=>{try{await navigator.clipboard.writeText(String(val));b.textContent="Copied"}catch(e){b.textContent=String(val)}};return b}
function card(x,stale){
  const {c,s}=x,p=s.plan,cls=x.st==="CONFIRMED"?"confirmed":x.st==="BLOCKED"?"blocked":"watch";
  const el=h("div","card "+cls),r=h("div","row");
  r.append(h("div","pair",c.pair),h("div","chip",x.st==="CONFIRMED"?"Confirmed 4/4":x.st==="BLOCKED"?"Blocked":"Watch "+s.met+"/"+s.total));
  el.append(r,h("div","mute",s.strategy+", candle closed "+Math.round(((x.ref||D.l.time)-s.candle_t)/60)+(x.ref?" min before the alert":" min before the scan")));
  if(x.ref)el.append(h("div","mute","Alerted "+mins(x.ref)+" min ago, so check the live price first. It may be gone from the 5-minute snapshot below."));
  if(x.others&&x.others.length)el.append(h("div","mute","Also "+(x.st==="CONFIRMED"?"confirmed":"flagged")+" here: "+x.others.join(", ")));
  const ul=h("ul","cond");Object.entries(s.conditions).forEach(([k,ok])=>ul.append(h("li",ok?"ok":"no",(ok?"✓ ":"✗ ")+k.replace(/_/g," "))));el.append(ul);
  const g=h("div","grid");const cell=(a,b)=>{const d=h("div");d.append(h("span",0,a),h("b",0,b));g.append(d)};
  cell("Bid",num(c.bid));cell("Ask",num(c.ask));cell("RSI / volume",s.rsi.toFixed(0)+" / "+s.rel_volume.toFixed(2)+"x");
  if(p.entry){cell("Entry",num(p.entry));cell("Do not chase above",num(p.max_entry));cell("Stop",num(p.stop)+" (−"+p.risk_pct.toFixed(1)+"%)");cell("Target",num(p.target));cell("Net reward/risk",p.net_rr.toFixed(2));cell("Spread",p.spread_pct.toFixed(2)+"%")}
  el.append(g);
  const pl=h("div","plain");
  if(x.st==="CONFIRMED")pl.textContent="In plain English: every check passed. If you buy near "+num(p.entry)+", you would sell if the price falls to "+num(p.stop)+" (a small loss) or rises to "+num(p.target)+" (a profit). Only act if the scan above is under 5 minutes old and the live price in Coinbase is still below "+num(p.max_entry)+".";
  else if(x.st==="BLOCKED")pl.textContent="In plain English: it looked like a buy signal, but a safety check failed (see why below). Do not buy this one.";
  else pl.textContent="In plain English: not ready. Some checks pass but not all. Do nothing. NightOwl will message you if it turns into a full signal.";
  el.append(pl);
  if(p.entry)el.append(h("div","mute","On "+p.position+": about +"+p.profit_if_target_net.toFixed(2)+" at target or "+p.loss_if_stop_net.toFixed(2)+" at stop, after assumed 0.8% costs. Estimates only."));
  if(p.reasons&&p.reasons.length&&x.st!=="WATCH"){const rs=h("div","reasons");rs.append(h("b",0,"Why blocked: "),p.reasons.join("; "));el.append(rs)}
  else if(x.st==="WATCH"){el.append(h("div","mute","Not confirmed: "+Object.entries(s.conditions).filter(e=>!e[1]).map(e=>e[0].replace(/_/g," ")).join(", ")))}
  const b=h("div","btns");
  if(x.st==="CONFIRMED"&&!stale){b.append(copyBtn("entry",num(p.entry)),copyBtn("stop",num(p.stop)),copyBtn("target",num(p.target)));const lg=h("button",0,"Log my trade");lg.onclick=()=>{draft={pair:c.pair,strat:s.strategy[0],stop:num(p.stop),target:num(p.target)};tab="res";render();scrollTo(0,0)};b.append(lg)}
  const pr=encodeURIComponent(c.pair),web="https://www.coinbase.com/en-au/advanced-trade/spot/"+pr;
  const ap=h("a","btn go","Open Coinbase app");ap.href="intent://www.coinbase.com/advanced-trade/spot/"+pr+"#Intent;scheme=https;package=com.coinbase.android;S.browser_fallback_url="+encodeURIComponent(web)+";end";b.append(ap);
  const a=h("a","btn","Website");a.href=web;a.target="_blank";a.rel="noopener";b.append(a);el.append(b);
  if(x.st==="CONFIRMED")el.append(h("div","foot","Manual trade only. NightOwl has placed no order. Check the live price, and set your own stop on Coinbase."));
  return el}
function group(list){
  const m=new Map();
  list.forEach(x=>{const cur=m.get(x.c.pair),sc=y=>(y.s.plan&&y.s.plan.net_rr)||0;
    if(!cur){m.set(x.c.pair,{...x,others:[]});return}
    const better=rank(x)<rank(cur)||(rank(x)===rank(cur)&&(sc(x)>sc(cur)||(sc(x)===sc(cur)&&x.s.met>cur.s.met)));
    if(better)m.set(x.c.pair,{...x,others:rank(cur)===rank(x)?[...cur.others,cur.s.strategy]:[]});
    else if(rank(x)===rank(cur))cur.others.push(x.s.strategy)});
  return [...m.values()]}
function vOpp(v,stale){
  const base=setups().filter(x=>rank(x)<9&&(x.st!=="WATCH"||x.s.met>=2));
  const list=group(base).sort((a,b)=>rank(a)-rank(b)||b.s.met-a.s.met).slice(0,12);
  const have=new Set(list.filter(x=>x.st==="CONFIRMED").map(x=>x.c.pair+"|"+x.s.candle_t));
  const fresh=[...D.hi].reverse().filter(a=>mins(a.time)<=15&&a.plan&&a.plan.entry&&!have.has(a.pair+"|"+a.candle_t)).map(a=>({c:{pair:a.pair,bid:a.plan.bid,ask:a.plan.ask},s:{strategy:a.strategy,conditions:a.conditions||{},met:4,total:4,rsi:a.rsi||0,rel_volume:a.rel_volume||0,candle_t:a.candle_t,plan:a.plan},st:"CONFIRMED",others:a.also||[],ref:a.time}));
  if(fresh.length){v.append(h("div","foot","Just alerted on Telegram (last 15 minutes)"));fresh.forEach(x=>v.append(card(x,false)))}
  if(!list.length&&!fresh.length){v.append(h("div","empty","No setups close to confirming. NightOwl checks again every few minutes, and Telegram alerts you if one is confirmed."));return}
  list.forEach(x=>v.append(card(x,stale)))}
function vWatch(v){
  (D.l?.coins||[]).forEach(c=>{const best=(c.setups||[]).reduce((m,s)=>Math.max(m,s.met),0),st=(c.setups||[]).some(s=>s.plan?.status==="CONFIRMED")?"green":(c.setups||[]).some(s=>s.plan?.status==="BLOCKED")?"red":best>=2?"amber":"";
    const r=h("div","coin"),l=h("div");l.append(h("span","dot "+st),h("b",0,c.symbol));
    const rt=h("div","mute",c.pair?num(c.ask)+"  ("+best+"/4 best)":(c.status==="UNAVAILABLE"?"Not on Coinbase USDC/USD":"Data error"));r.append(l,rt);v.append(r)});
  if(!D.l)v.append(h("div","empty","No data yet."))}
function vHist(v){
  const hi=[...D.hi].reverse();if(!hi.length){v.append(h("div","empty","No confirmed alerts yet. They will appear here, with their original time."));return}
  hi.forEach(a=>{const age=mins(a.time),exp=age>30,el=h("div","card "+(exp?"":"confirmed")),r=h("div","row");
    r.append(h("div","pair",a.pair),h("div","chip",exp?"Expired":"Check live price"));el.append(r,h("div","mute",a.strategy+", sent "+fmtT(a.time)+" ("+(age<120?age+" min":Math.round(age/60)+" h")+" ago)"));
    const p=a.plan;if(p&&p.entry)el.append(h("div","mute","Entry "+num(p.entry)+", stop "+num(p.stop)+", target "+num(p.target)+(a.alerted?"":" (Telegram not delivered)")));
    el.append(h("div","foot",exp?"This signal is old. Do not trade it from this screen.":"Signals go stale fast. Check the live price first."));v.append(el)})}
const JK="nightowl.journal.v1";let JMEM=[],draft=null,exitFor=null,xd={};
function jload(){try{return JSON.parse(localStorage.getItem(JK)||"[]")}catch(e){return JMEM}}
function jsave(a){JMEM=a;try{localStorage.setItem(JK,JSON.stringify(a))}catch(e){}}
function field(label,key,obj,ph,n){const w=h("label","fld"),i=document.createElement("input");w.append(h("span",0,label));i.value=obj[key]||"";i.placeholder=ph||"";if(n)i.inputMode="decimal";i.oninput=()=>{obj[key]=i.value};w.append(i);return w}
function jform(){
  const f=h("div"),d=draft;
  f.append(field("Pair (for example ZEC-USDC)","pair",d,"ZEC-USDC"),field("Price you paid (the fill price)","entry",d,"1251.66",1),field("Coin amount you bought","qty",d,"0.0279309",1),field("Total paid in USDC, including the fee","paid",d,"35.00",1),field("Your stop price","stop",d,"",1),field("Your target price","target",d,"",1),field("Notes (optional)","notes",d,""));
  const s=h("label","fld"),sel=document.createElement("select");s.append(h("span",0,"Strategy"));
  [["A","A: 15m confirmation"],["B","B: 5m breakout"],["C","C: 5m pullback"],["X","Other / my own idea"]].forEach(o=>{const e=document.createElement("option");e.value=o[0];e.textContent=o[1];if(o[0]===d.strat)e.selected=true;sel.append(e)});
  sel.onchange=()=>{d.strat=sel.value};s.append(sel);f.append(s);
  const msg=h("div","reasons");msg.hidden=true;const sv=h("button",0,"Save trade");
  sv.onclick=()=>{const e=+d.entry,p=+d.paid;if(!d.pair||!(e>0)||!(p>0)){msg.hidden=false;msg.textContent="Please fill in the pair, the price you paid and the total paid.";return}
    const a=jload();a.push({id:Date.now(),opened:Date.now()/1000,pair:d.pair.toUpperCase().trim(),strat:d.strat||"B",entry:e,qty:+d.qty||null,paid:p,stop:+d.stop||null,target:+d.target||null,notes:d.notes||""});jsave(a);draft=null;render()};
  f.append(msg,sv);return f}
function jrow(t){
  const el=h("div","trade"),r=h("div","row");
  r.append(h("b",0,t.pair),h("span",t.net==null?"mute":t.net>=0?"ok":"no",t.net==null?"Open":(t.net>=0?"+":"")+t.net.toFixed(2)+" USDC ("+(t.net>=0?"+":"")+(t.net/t.paid*100).toFixed(1)+"%)"));
  el.append(r,h("div","mute",fmtT(t.opened)+", strategy "+t.strat+(t.notes?", "+t.notes:"")),h("div","mute","Paid "+num(t.entry)+", total "+t.paid.toFixed(2)+" USDC"+(t.stop?", stop "+num(t.stop):"")+(t.target?", target "+num(t.target):"")));
  if(t.net!=null&&t.exit_total!=null)el.append(h("div","mute","Received "+t.exit_total.toFixed(2)+" USDC"+(t.exit?" (sold at "+num(t.exit)+")":"")));
  const b=h("div","btns");
  if(t.net==null){const x=h("button",0,exitFor===t.id?"Cancel":"Record exit");x.onclick=()=>{exitFor=exitFor===t.id?null:t.id;xd={};render()};b.append(x)}
  const del=h("button",0,"Delete");del.onclick=()=>{if(confirm("Delete this trade from your journal?")){jsave(jload().filter(z=>z.id!==t.id));render()}};b.append(del);
  el.append(b);
  if(exitFor===t.id){const f=h("div"),msg=h("div","reasons");msg.hidden=true;
    f.append(field("Price you sold at (optional)","xp",xd,"",1),field("Total received in USDC, after the fee","xr",xd,"",1));
    const sv=h("button",0,"Save exit");sv.onclick=()=>{const g=+xd.xr;if(!(g>0)){msg.hidden=false;msg.textContent="Enter the total you received in USDC.";return}
      const a=jload(),z=a.find(q=>q.id===t.id);z.exit=+xd.xp||null;z.exit_total=g;z.net=g-z.paid;z.closed=Date.now()/1000;jsave(a);exitFor=null;render()};
    f.append(msg,sv);el.append(f)}
  return el}
function vJournal(v){
  const all=jload(),c=h("div","card"),done=all.filter(t=>t.net!=null),wins=done.filter(t=>t.net>0).length,tot=done.reduce((a,t)=>a+t.net,0);
  c.append(h("div","pair","My trades"),h("div","mute","Your own Coinbase trades, typed in by you. NightOwl never marks a trade as filled. They are saved only on this phone, so download the CSV now and then as a backup."));
  if(done.length)c.append(h("div","plain",done.length+" closed, "+wins+" won. Total result "+(tot>=0?"+":"")+tot.toFixed(2)+" USDC, using the real totals you entered."));
  const b=h("div","btns"),add=h("button",0,draft?"Cancel":"Add a trade");add.onclick=()=>{draft=draft?null:{strat:"B"};render()};b.append(add);
  const dl=h("button",0,"Download CSV");dl.onclick=()=>{const cols=["opened","pair","strat","entry","qty","paid","stop","target","exit","exit_total","net","notes"],q=x=>'"'+String(x==null?"":x).replace(/"/g,'""')+'"';
    const csv=[cols.join(",")].concat(all.map(t=>cols.map(k=>q(k==="opened"?new Date(t.opened*1000).toISOString():t[k])).join(","))).join("\n");
    const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([csv],{type:"text/csv"}));a.download="nightowl-journal.csv";a.click()};b.append(dl);c.append(b);
  if(draft)c.append(jform());
  if(!all.length&&!draft)c.append(h("div","empty","No trades yet. Tap Add a trade after you buy on Coinbase, or tap Log my trade on a confirmed card."));
  all.slice().reverse().sort((a,b)=>(a.net!=null)-(b.net!=null)).forEach(t=>c.append(jrow(t)));
  v.append(c)}
function vTrack(v){vJournal(v);vRes(v)}
function stat(rs){
  const done=rs.filter(r=>r.outcome==="win"||r.outcome==="loss"),w=done.filter(r=>r.outcome==="win").length,net=rs.filter(r=>r.net_pct!=null);
  return {n:rs.length,done:done.length,wr:done.length?w/done.length*100:null,avg:net.length?net.reduce((a,r)=>a+r.net_pct,0)/net.length:null,
    open:rs.filter(r=>r.outcome==="open").length,unk:rs.filter(r=>r.outcome==="unknown").length}}
function line(label,rs){
  const s=stat(rs),d=h("div","coin"),l=h("div");l.append(h("b",0,label),h("div","mute",s.n+" signals, "+s.done+" decided"+(s.open?", "+s.open+" open":"")+(s.unk?", "+s.unk+" unknown":"")));
  const r=h("div","mute",s.done?s.wr.toFixed(0)+"% won, avg "+(s.avg>=0?"+":"")+s.avg.toFixed(2)+"%":"–");d.append(l,r);return d}
function vRes(v){
  const rs=D.pa||[],el=h("div","card");
  el.append(h("div","pair","Paper research"),h("div","mute","Hypothetical only. These are not real trades or real profits. Each signal assumes entry at the ask, the stop wins if both levels touch in one candle, and 0.8% costs are deducted."));
  if(!rs.length){el.append(h("div","empty","Nothing recorded yet. Every 4/4 signal, allowed or blocked, is tracked from now on."));v.append(el);return}
  el.append(line("All signals",rs),line("Allowed (alerted)",rs.filter(r=>r.group==="allowed")),line("Blocked by safety checks",rs.filter(r=>r.group==="blocked")));
  [...new Set(rs.map(r=>r.strategy))].sort().forEach(s=>el.append(line(s,rs.filter(r=>r.strategy===s))));
  const dn=stat(rs).done;if(dn<30)el.append(h("div","reasons","Only "+dn+" decided so far. Too few to draw conclusions: expect results to swing a lot until there are 30 or more."));
  const b=h("div","btns"),dl=h("button",0,"Download CSV");dl.onclick=()=>{
    const cols=["created","pair","strategy","group","entry","stop","target","outcome","exit","net_pct","blocked_by"];
    const q=x=>'"'+String(x==null?"":Array.isArray(x)?x.join("; "):x).replace(/"/g,'""')+'"';
    const csv=[cols.join(",")].concat(rs.map(r=>cols.map(c=>q(c==="created"?new Date(r.created*1000).toISOString():r[c])).join(","))).join("\n");
    const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([csv],{type:"text/csv"}));a.download="nightowl-paper.csv";a.click()};
  b.append(dl);el.append(b);v.append(el)}

  add("Habits that protect you",[["Start small","use 10 to 20 on your first trades while you learn"],["Never move a stop down","that just turns a small loss into a big one"],["Skip what confuses you","missing a trade costs nothing"],["Expect losses","even good systems lose often. This is normal"],["Keep records","use the Research tab to see what the rules really did"]]);
  l.append(h("div","foot","This is education, not financial advice. Crypto can lose value quickly and you can lose everything you put in."));
  v.append(l);vHealth(v)}
function vHealth(v){
  const e=D.he;if(!e){v.append(h("div","empty","No health data yet."));return}
  const el=h("div","card"),rows=[["Version",e.version],["Held back at last re-check",(D.l?.coins||[]).filter(c=>c.held).length+" coins"],["Last successful scan",e.last_success?fmtT(e.last_success):"None yet"],["Last Coinbase connection",e.last_api_ok?fmtT(e.last_api_ok):"None yet"],["Last Telegram send",e.telegram?(e.telegram.ok?"Delivered ":"Failed: ")+fmtT(e.telegram.time):"No alert sent yet"],["Errors",e.errors&&e.errors.length?e.errors.length+" this scan":"None"]];
  rows.forEach(r=>{const d=h("div","coin");d.append(h("span","mute",r[0]),h("b",0,r[1]));el.append(d)});
  (e.errors||[]).slice(0,5).forEach(x=>el.append(h("div","reasons",x)));
  el.append(h("div","foot","Scans are scheduled every 5 minutes but GitHub can delay them. Coinbase availability for your account must be confirmed in Coinbase."));v.append(el)}
